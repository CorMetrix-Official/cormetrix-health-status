# Change these first
owner: CorMetrix-Official
repo: cormetrix-health-status

sites:
  - name: VerixAi Frontend Application
    url: $FRONTEND_ENDPOINT
  - name: VerixAi Login Server Endpoint
    url: $LOGIN_SERVER
  - name: VerixAi Backend Endpoint
    url: $BACKEND_SERVER
  - name: VerixAi Chat Endpoint
    url: $CHAT_SERVER
  - name: VerixAi ETL Endpoint
    url: $ETL_SERVER

status-website:
